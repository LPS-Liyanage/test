<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Input Field</title>
</head>
<body>
  <p><strong>Local XSS test page</strong> &mdash; input below is rendered with <code>innerHTML</code> on purpose, so it will execute any script you enter. For local testing only.</p>
  <form id="testForm">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name">
    <button type="submit">Submit</button>
  </form>

  <h3>Output:</h3>
  <div id="output"></div>

  <script>
    document.getElementById('testForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var value = document.getElementById('name').value;
      // Intentionally unsafe: renders raw input via innerHTML for XSS testing.
      document.getElementById('output').innerHTML = value;
    });
  </script>
</body>
</html>
